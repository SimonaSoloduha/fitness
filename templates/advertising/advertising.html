<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kit – Simona Soloduha</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;height:100%}
        body{font-family:Arial,Helvetica,sans-serif;background:#01000d;overflow:hidden}

        .bar{
            position:fixed;top:0;left:0;right:0;height:56px;
            background:#01000d;display:flex;align-items:center;
            padding:0 1rem;z-index:1000;
            box-shadow:0 2px 8px rgba(0,0,0,.35)
        }

        .bar a{
            color:#fff;text-decoration:none;font-size:.9rem;
            border:1px solid #6dc0ef;padding:6px 14px;border-radius:4px;
            transition:background .25s
        }

        .bar a:hover{background:#6dc0ef}

        #pdf-container{
            position:fixed;top:56px;left:0;right:0;bottom:0;
            width:100%;height:calc(100vh - 56px);
            overflow-y:auto;-webkit-overflow-scrolling:touch;
            background:#323639;text-align:center;padding:10px 0
        }

        .page{
            width:100%;position:relative;display:flex;
            justify-content:center;margin-bottom:10px
        }

        canvas{
            display:block;max-width:98%;height:auto!important;
            box-shadow:0 4px 12px rgba(0,0,0,.3)
        }

        .loading{
            position:absolute;top:20px;left:50%;
            transform:translateX(-50%);
            color:rgba(255,255,255,.5);font-size:13px
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
    <div class="bar">
        <a href="/">← На главную</a>
    </div>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url='{{ pdf_url }}';
        const container=document.getElementById('pdf-container');
        const SCALE=1.2;
        const rendering=new Set();

        pdfjsLib.getDocument({
            url:url,
            disableAutoFetch:false,
            disableStream:false
        }).promise.then(async pdf=>{

            const pages=[];

            for(let pageNum=1;pageNum<=pdf.numPages;pageNum++){

                const page=await pdf.getPage(pageNum);
                const viewport=page.getViewport({scale:SCALE});

                const wrapper=document.createElement('div');
                wrapper.className='page';
                wrapper.dataset.page=pageNum;
                wrapper.style.height=viewport.height+'px';

                const loading=document.createElement('div');
                loading.className='loading';
                loading.textContent='Загрузка…';

                wrapper.appendChild(loading);
                container.appendChild(wrapper);

                pages.push({pageNum,wrapper,rendered:false});
            }

            const observer=new IntersectionObserver(entries=>{
                entries.forEach(entry=>{
                    if(!entry.isIntersecting)return;

                    const pageData=pages.find(p=>p.wrapper===entry.target);

                    if(!pageData||pageData.rendered)return;

                    renderPage(pdf,pageData);
                });
            },{
                root:container,
                rootMargin:'800px 0px'
            });

            pages.forEach(pageData=>observer.observe(pageData.wrapper));

        }).catch(error=>{
            console.error('PDF error:',error);
            container.innerHTML='<div style="color:white;padding:30px;">Не удалось загрузить Media Kit.</div>';
        });

        async function renderPage(pdf,pageData){

            if(pageData.rendered||rendering.has(pageData.pageNum))return;

            rendering.add(pageData.pageNum);

            try{
                const page=await pdf.getPage(pageData.pageNum);
                const viewport=page.getViewport({scale:SCALE});

                const canvas=document.createElement('canvas');
                const context=canvas.getContext('2d',{alpha:false});

                canvas.width=viewport.width;
                canvas.height=viewport.height;
                canvas.style.width=viewport.width+'px';
                canvas.style.height=viewport.height+'px';

                const loading=pageData.wrapper.querySelector('.loading');
                if(loading)loading.remove();

                pageData.wrapper.appendChild(canvas);

                await page.render({
                    canvasContext:context,
                    viewport:viewport
                }).promise;

                pageData.rendered=true;

            }catch(error){
                console.error('Page '+pageData.pageNum+' error:',error);
            }finally{
                rendering.delete(pageData.pageNum);
            }
        }
    </script>
</body>
</html>
